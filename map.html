<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC72C">
<title>Where is the shuttle?</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6DC;--panel:#FFFDF5;--ink:#3A2D05;--line:#3A2D05;--soft:#FFE9A3;--pale:#FFF1BF;--yellow:#FFC72C;--amber:#E8A900;--brown:#3A2D05}
@media (prefers-color-scheme:dark){:root{--bg:#2A2108;--panel:#3A2D05;--ink:#FFF1BF;--line:#9C7F1F;--soft:#4A3A0A;--pale:#4A3A0A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;line-height:1.45;
 padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.wrap{max-width:1000px;margin:0 auto;padding:14px 14px 30px}
.banner{background:var(--yellow);color:var(--brown);border:3px solid var(--brown);border-radius:14px;padding:12px 18px;margin-bottom:14px}
.banner h1{margin:0;font-size:clamp(1.4rem,5vw,2rem);font-weight:800;letter-spacing:-.01em}
.banner a{color:var(--brown);font-weight:700}
.layout{display:grid;grid-template-columns:3fr 2fr;gap:14px}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.mapbox{position:relative;height:min(62vh,460px);min-height:320px;border:3px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft)}
#map{position:absolute;inset:0}
#mapMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-weight:600;z-index:2}
#chip{position:absolute;top:10px;left:10px;z-index:5;padding:6px 12px;border:2px solid var(--brown);border-radius:999px;font-weight:700;font-size:.85rem;color:var(--brown);background:#FFF6DC}
#chip.live{background:#FFC72C}#chip.stale{background:#F5A800}#chip.err{background:#3A2D05;color:#FFF6DC}
button{font:inherit;font-weight:700;min-height:46px;padding:8px 16px;border:2px solid var(--brown);border-radius:10px;background:var(--yellow);color:var(--brown);cursor:pointer}
button.alt{background:var(--soft)}
#center{position:absolute;bottom:12px;left:10px;z-index:5;min-height:40px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.k{font-size:.9rem;font-weight:600;opacity:.8}.v{font-size:1.7rem;font-weight:800}.sub{font-size:.9rem;opacity:.85}
details{background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:12px}
summary{font-weight:700;cursor:pointer;min-height:32px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
label{font-size:.9rem;font-weight:600;display:block}
input{width:100%;min-height:42px;font:inherit;padding:6px 10px;border:2px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
 <div class="banner"><h1>🚌 Where is the shuttle?</h1><a href="index.html">Go to the stop counter</a></div>
 <div class="layout">
  <div class="mapbox"><div id="map"></div><div id="mapMsg">Add your Google Maps API key in Settings below.</div>
   <div id="chip">Loading…</div><button id="center" type="button">Center on bus</button></div>
  <div>
   <div class="card"><div class="k">Bus distance from the stop</div><div class="v" id="dist">–</div><div class="sub" id="eta"></div></div>
   <div class="card"><div class="k">Bus source</div><div class="sub" id="source"></div></div>
  </div>
 </div>
 <details id="settings"><summary>Settings</summary>
  <div class="fields">
   <div style="grid-column:1/-1"><label for="key">Google Maps API key</label><input id="key" type="password" autocomplete="off"></div>
   <div><label for="name">Stop name</label><input id="name"></div>
   <div><label for="lat">Stop latitude</label><input id="lat" inputmode="decimal"></div>
   <div><label for="lng">Stop longitude</label><input id="lng" inputmode="decimal"></div>
   <div style="grid-column:1/-1"><label for="feed">Live bus feed: your Firebase database address (leave empty for the demo bus)</label>
   <input id="feed" type="url" placeholder="https://your-project-default-rtdb.firebaseio.com"></div>
  </div>
  <div class="row"><button id="here" type="button" class="alt">Use my current location as the stop</button>
  <button id="save" type="button">Save and reload the map</button></div>
  <p class="sub" id="hereMsg"></p>
 </details>
</div>
<script src="map.js"></script>
</body>
</html>
