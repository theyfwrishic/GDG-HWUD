<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC72C">
<title>Share bus location</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6DC;--panel:#FFFDF5;--ink:#3A2D05;--line:#3A2D05;--soft:#FFE9A3;--yellow:#FFC72C;--amber:#E8A900;--brown:#3A2D05}
@media (prefers-color-scheme:dark){:root{--bg:#2A2108;--panel:#3A2D05;--ink:#FFF1BF;--line:#9C7F1F;--soft:#4A3A0A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;line-height:1.45;
 padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 30px}
.banner{background:var(--yellow);color:var(--brown);border:3px solid var(--brown);border-radius:14px;padding:12px 18px;margin-bottom:14px}
.banner h1{margin:0;font-size:clamp(1.4rem,5vw,2rem);font-weight:800}
.banner p{margin:3px 0 0;font-size:.95rem}
button{font:inherit;font-weight:800;min-height:64px;width:100%;font-size:1.3rem;border:3px solid var(--brown);border-radius:14px;background:var(--yellow);color:var(--brown);cursor:pointer}
button.on{background:var(--brown);color:var(--yellow)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:12px}
.k{font-size:.9rem;font-weight:600;opacity:.8}.v{font-size:1.3rem;font-weight:800}
.err{color:var(--ink);font-weight:700}
details{background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:12px}
summary{font-weight:700;cursor:pointer;min-height:32px}
label{font-size:.9rem;font-weight:600;display:block;margin-top:10px}
input{width:100%;min-height:42px;font:inherit;padding:6px 10px;border:2px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
 <div class="banner"><h1>🚌 Share bus location</h1><p>For the driver or whoever is on the bus. Keep this page open and the screen on.</p></div>
 <button id="go" type="button">Start sharing</button>
 <div class="card"><div class="k">Status</div><div class="v" id="state">Not sharing</div></div>
 <div class="card"><div class="k">Last position sent</div><div class="v" id="sent">–</div></div>
 <div class="card"><div class="k">GPS accuracy and speed</div><div class="v" id="gps">–</div></div>
 <p class="err" id="err" role="alert"></p>
 <details id="settings"><summary>Settings</summary>
  <label for="db">Firebase database address</label><input id="db" placeholder="https://your-project-default-rtdb.firebaseio.com">
  <label for="code">Share code (the secret from your Firebase rules)</label><input id="code" type="password" autocomplete="off">
  <button id="save" type="button" style="min-height:46px;font-size:1rem;margin-top:12px">Save</button>
 </details>
</div>
<script src="driver.js"></script>
</body>
</html>
